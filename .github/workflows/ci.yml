name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    env:
      # Placeholder: only needed for `prisma generate` to resolve its config, no live DB required for build/lint.
      DATABASE_URL: "postgresql://user:password@localhost:5432/apc_universal_repair"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build

      - name: Install Playwright browser
        run: pnpm --filter @apc/web exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm turbo run test

      - name: Playwright E2E (web)
        run: pnpm --filter @apc/web run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
