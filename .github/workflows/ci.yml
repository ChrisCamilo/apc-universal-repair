name: CI

# Runs on pull requests only: a merge to main brings code each pull request already checked, so it isn't run again.
on:
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    env:
      # Placeholder: only needed for `prisma generate` to resolve its config, no live DB required for build/lint.
      DATABASE_URL: "postgresql://user:password@localhost:5432/apc_universal_repair"
      # The desktop app's Electron binary is only needed by the Desktop workflow, on Windows.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every installed package's license must be allowed or reviewed, and every shipped one in THIRD_PARTY_NOTICES.md
      # (scripts/licenses.mjs).
      - name: Licenses
        run: pnpm licenses:check

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build

      - name: Install Playwright browser
        run: pnpm --filter @apc/web exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm turbo run test

      - name: Playwright E2E (web)
        run: pnpm --filter @apc/web run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Builds an empty database from the migrations of each database the API runs on, as a new computer at home does
  # (docs/home-server.md), checks it matches its schema, seeds it and runs the API's tests that need a database. All
  # the migrations run in one session here, unlike on a database that took them one at a time. The SQLite file is
  # encrypted with a key, as the desktop app's is (apps/api/src/db/cipher.ts); the key is for this job only.
  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: postgresql
            url: "postgresql://postgres:postgres@localhost:5432/apc_universal_repair"
            key: ""
          - name: sqlite
            url: "file:./data/ci.db"
            key: "c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1"
    name: migrations (${{ matrix.database.name }})
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apc_universal_repair
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database.url }}
      APC_SQLITE_KEY: ${{ matrix.database.key }}
      # A PostgreSQL server the copy tests make databases in, for both databases.
      TEST_POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the migrations to an empty database
        run: pnpm --filter @apc/api db:migrate

      - name: Check the database matches its schema
        run: pnpm --filter @apc/api db:check

      - name: Seed it
        run: pnpm --filter @apc/api db:seed

      - name: API tests against the database
        run: pnpm --filter @apc/api test:db
