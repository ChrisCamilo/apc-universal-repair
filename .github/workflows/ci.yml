name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    env:
      # Placeholder: only needed for `prisma generate` to resolve its config, no live DB required for build/lint.
      DATABASE_URL: "postgresql://user:password@localhost:5432/apc_universal_repair"
      # The desktop app's Electron binary is only needed by the Desktop workflow, on Windows.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build

      - name: Install Playwright browser
        run: pnpm --filter @apc/web exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm turbo run test

      - name: Playwright E2E (web)
        run: pnpm --filter @apc/web run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Builds an empty database from the migrations, as a new computer at home does (docs/home-server.md), checks it
  # matches schema.prisma and seeds it. All the migrations run in one session here, unlike on a database that took them
  # one at a time. The API's tests that need a database then run on it.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apc_universal_repair
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/apc_universal_repair"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the migrations to an empty database
        run: pnpm --filter @apc/api exec prisma migrate deploy

      - name: Check the database matches schema.prisma
        run: pnpm --filter @apc/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed it
        run: pnpm --filter @apc/api db:seed

      - name: API tests against the database
        run: pnpm --filter @apc/api test:db

  # The same as the migrations job on SQLite: builds an empty database file from prisma/sqlite's migrations, checks it
  # matches prisma/sqlite/schema.prisma, seeds it and runs the API's tests that need a database, one file at a time,
  # as the API is the only process writing to the file.
  sqlite:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./data/ci.db"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the migrations to an empty SQLite file
        run: pnpm --filter @apc/api exec prisma migrate deploy --config prisma.sqlite.config.ts

      - name: Check the file matches prisma/sqlite/schema.prisma
        run: pnpm --filter @apc/api exec prisma migrate diff --config prisma.sqlite.config.ts --from-config-datasource --to-schema prisma/sqlite/schema.prisma --exit-code

      - name: Seed it
        run: pnpm --filter @apc/api db:seed

      - name: API tests against the database
        run: pnpm --filter @apc/api test:db -- --test-concurrency=1
