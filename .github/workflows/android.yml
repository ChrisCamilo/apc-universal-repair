name: Android

# Builds the phone app's release APK, as a phone at the shop installs it, and uploads it as an artifact.
# - It signs with the upload key when the ANDROID_UPLOAD_* secrets are set, and with the debug key otherwise, naming the
#   artifact -debug-signed then: that APK installs, but can't update one signed with the upload key.
# - The address the app talks to comes from the repository variable APC_API_URL (Settings → Secrets and variables →
#   Actions → Variables), such as http://192.168.0.10:3000; the build fails without it.
# - It writes the Android libraries' licenses from the release's Gradle tree (`:app:writeLicenses`) and fails when they
#   differ from the committed apps/mobile/android/licenses.json, or when one isn't allowed (scripts/licenses.mjs).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "scripts/licenses.mjs"
      - ".github/workflows/android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Check the Android libraries' licenses
        run: |
          ./gradlew :app:writeLicenses
          git diff --exit-code licenses.json || {
            echo "::error::The release's Android libraries changed: run ./gradlew :app:writeLicenses in apps/mobile/android, then pnpm licenses:write, and commit the files."
            exit 1
          }
          cd ../../.. && pnpm licenses:check

      - name: Decode the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/apc-upload.keystore"
            echo "APC_UPLOAD_STORE_FILE=$RUNNER_TEMP/apc-upload.keystore" >> "$GITHUB_ENV"
            echo "ARTIFACT=app-release" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key in the secrets: the APK is signed with the debug key."
            echo "ARTIFACT=app-release-debug-signed" >> "$GITHUB_ENV"
          fi

      - name: Build the release APK
        env:
          APC_API_URL: ${{ vars.APC_API_URL }}
          APC_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          APC_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          APC_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Check the APK carries the notices
        run: unzip -l app/build/outputs/apk/release/app-release.apk | grep -q "assets/THIRD_PARTY_NOTICES.md"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
