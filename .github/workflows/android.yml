name: Android

# The phone app's release APK (apps/mobile), as a phone at the shop installs it.
# - Pull requests that change the phone app, the shared package or the lockfile: check the Android libraries' licenses
#   and build the APK for arm64-v8a alone, uploading nothing.
# - Run by hand (Actions → Android → Run workflow): the same, then upload the APK as an artifact, kept 14 days.
# - Called by the Desktop workflow's release (`release: true`): the same, then, when it is signed with the upload key,
#   upload it as apc-universal-repair-<version>.apk in the artifact `release-apk`, for the release to carry, and say so
#   in the output `signed`. A debug-signed APK can't update the phones' app, so the release goes out without it.
# Both write the Android libraries' licenses from the release's Gradle tree (`:app:writeLicenses`) and fail when they
# differ from the committed apps/mobile/android/licenses.json, or when one isn't allowed (scripts/licenses.mjs). The
# APK carries no server address: the app pairs with the server at home on its first start. It signs with the upload
# key when the ANDROID_UPLOAD_* secrets are set, and with the debug key otherwise, naming the artifact -debug-signed
# then: that APK installs, but can't update one signed with the upload key.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Upload the APK for a release to carry.
        type: boolean
        default: true
    outputs:
      signed:
        description: Whether the APK is signed with the upload key and was uploaded as `release-apk`.
        value: ${{ jobs.android.outputs.signed }}
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "scripts/licenses.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.release.outputs.signed }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # GitHub's Ubuntu runners come with the Android SDK in ANDROID_HOME, its licenses accepted; the repository allows
      # only GitHub's own actions and pnpm's. Gradle doesn't install CMake, so the versions app/build.gradle asks for are
      # installed here.
      - name: Install the NDK and CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" "cmake;3.31.6"

      # The C++ is most of the build. ccache keeps its objects by their content, the compiler's included (the NDK is
      # installed again on each run), with paths taken from the workspace; the build passes it to CMake with
      # -Papc.ccache=true (see build.gradle). Its folder and Gradle's build cache are saved after every run, and the
      # latest one is restored: a pull request reuses what its own earlier runs, or the last release on main, compiled.
      - name: Install ccache
        run: |
          sudo apt-get install -y ccache
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"

      - name: Restore the compiled C++ and Gradle's build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            ~/.gradle/caches/build-cache-1
          key: android-build-${{ github.run_id }}
          restore-keys: android-build-

      - name: Check the Android libraries' licenses
        run: |
          ./gradlew :app:writeLicenses
          git diff --exit-code licenses.json || {
            echo "::error::The release's Android libraries changed: run ./gradlew :app:writeLicenses in apps/mobile/android, then pnpm licenses:write, and commit the files."
            exit 1
          }
          cd ../../.. && pnpm licenses:check

      - name: Decode the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/apc-upload.keystore"
            echo "APC_UPLOAD_STORE_FILE=$RUNNER_TEMP/apc-upload.keystore" >> "$GITHUB_ENV"
            echo "ARTIFACT=app-release" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key in the secrets: the APK is signed with the debug key."
            echo "ARTIFACT=app-release-debug-signed" >> "$GITHUB_ENV"
          fi

      # A pull request builds the phones' architecture alone, which proves the app builds and signs; runs by hand and
      # the release build every architecture in gradle.properties.
      - name: Build the release APK
        env:
          APC_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          APC_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          APC_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ARCHITECTURES: ${{ github.event_name == 'pull_request' && '-PreactNativeArchitectures=arm64-v8a' || '' }}
        run: ./gradlew assembleRelease -Papc.ccache=true $ARCHITECTURES

      - name: Say how much C++ ccache reused
        if: always()
        run: ccache --show-stats

      - name: Check the APK carries the notices
        run: unzip -l app/build/outputs/apk/release/app-release.apk | grep -q "assets/THIRD_PARTY_NOTICES.md"

      - name: Upload the APK, when run by hand
        if: github.event_name == 'workflow_dispatch' && !inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # The phone app finds its update by this name (apps/mobile/src/features/updates/appUpdate.ts).
      - name: Name the APK for the release, when signed with the upload key
        id: release
        if: inputs.release
        run: |
          if [ "$ARTIFACT" != "app-release" ]; then
            echo "::warning::No upload key in the secrets: the release goes out without the APK, since a debug-signed one can't update the phones' app."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('../package.json').version")
          mkdir -p "$RUNNER_TEMP/release-apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release-apk/apc-universal-repair-$version.apk"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload the APK for the release
        if: inputs.release && steps.release.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: ${{ runner.temp }}/release-apk/
          retention-days: 1
