<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <title>Filtro de óleo (ilustração da demo)</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f4d7a"/>
      <stop offset="0.35" stop-color="#3f7fbf"/>
      <stop offset="0.6" stop-color="#2b6299"/>
      <stop offset="1" stop-color="#173a5c"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d31"/>
      <stop offset="1" stop-color="#15171a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <ellipse cx="320" cy="425" rx="140" ry="20" fill="#000" opacity="0.35"/>
  <rect x="200" y="110" width="240" height="300" rx="26" fill="url(#body)"/>
  <rect x="200" y="200" width="240" height="120" fill="#e8e6e1" opacity="0.92"/>
  <text x="320" y="252" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#173a5c">FILTRO</text>
  <text x="320" y="292" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#3a3f45">DE ÓLEO</text>
  <ellipse cx="320" cy="110" rx="120" ry="22" fill="#4a8bc9"/>
  <ellipse cx="320" cy="96" rx="98" ry="16" fill="#9aa2ab"/>
  <ellipse cx="320" cy="92" rx="34" ry="8" fill="#3a3f45"/>
  <g stroke="#173a5c" stroke-width="3" opacity="0.5">
    <line x1="215" y1="130" x2="215" y2="190"/><line x1="245" y1="130" x2="245" y2="190"/>
    <line x1="395" y1="130" x2="395" y2="190"/><line x1="425" y1="130" x2="425" y2="190"/>
  </g>
</svg>
