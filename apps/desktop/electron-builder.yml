# Packages the desktop app for Windows: `pnpm --filter @apc/desktop dist`, after the web build. The output goes to
# release/ (gitignored): an NSIS installer and a portable exe, both unsigned, so SmartScreen warns on the first run,
# plus latest.yml and the installer's blockmap, which the Desktop workflow publishes to a GitHub Release for the
# updater. File names have no spaces, which GitHub would turn into dots and so break latest.yml.
appId: com.apc.universalrepair
productName: APC Universal Repair
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - static/**/*
  - build/icon.png
  - package.json
# The web build, served by the app:// protocol from resources/web.
extraResources:
  - from: ../web/dist
    to: web
win:
  target:
    - nsis
    - portable
nsis:
  artifactName: APC-Universal-Repair-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # A newer installer run over the installed app upgrades it in place: it finds the installed version by the appId,
  # removes it silently and installs into the same folder, asking to close the app first when it is open. The data in
  # %APPDATA% (the session, the preferences, config.json) stays, then and on uninstall.
  deleteAppDataOnUninstall: false
portable:
  artifactName: APC-Universal-Repair-${version}-portable.${ext}
# Where the updater looks for new versions: the repository's GitHub Releases, which the Desktop workflow publishes.
publish:
  provider: github
  owner: ChrisCamilo
  repo: apc-universal-repair
  releaseType: release
# Electron fuses: no running as plain Node, no NODE_OPTIONS or --inspect, and the app only loads from its checked ASAR.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
