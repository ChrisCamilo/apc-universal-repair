<!doctype html>
<!-- Shown while the desktop app starts the API on this computer (see src/server.ts), in the eighties/night colors; at
     #updating, while it brings the API to the app's version instead (see ensureApiVersion in src/main.ts). -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>APC Universal Repair</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body,
      section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0b0c0e;
        color: #e8e6e1;
        font: 16px system-ui, sans-serif;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(232, 230, 225, 0.25);
        border-top-color: #ffa31a;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      p {
        margin: 0;
      }
      #updating {
        display: none;
      }
      #updating:target {
        display: flex;
      }
      #updating:target ~ #starting {
        display: none;
      }
      .hint {
        color: rgba(232, 230, 225, 0.6);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <section id="updating">
      <div class="spinner" role="progressbar" aria-label="Atualizando o servidor"></div>
      <p>Atualizando o servidor APC…</p>
      <p class="hint">Ele está indo para a mesma versão deste app. Isso pode levar alguns minutos.</p>
    </section>
    <section id="starting">
      <div class="spinner" role="progressbar" aria-label="Ligando o servidor"></div>
      <p>Ligando o servidor APC…</p>
      <p class="hint">Na primeira vez isso pode levar até um minuto.</p>
    </section>
  </body>
</html>
