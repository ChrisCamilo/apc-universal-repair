buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// The libraries with C++ code (the camera's and Nitro's) build it with the CMake the app uses, 3.31 (see
// app/build.gradle): with the default 3.22, ninja can't read their object files' long paths on Windows, and loops
// re-running CMake.
subprojects {
    plugins.withId("com.android.library") {
        android.externalNativeBuild.cmake.version = "3.31.6"
    }
}
