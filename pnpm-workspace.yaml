packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  electron: true
  # The Squirrel installer of electron-builder; the desktop app ships as NSIS and portable only.
  electron-winstaller: false
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - fastify@5.12.4
  - zod@4.6.2
